<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>靈籤舍</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#efe6d8;--fg:#2a1a14;--card:#fffaf0;--line:#d8c7a8;--red:#c1221b;--gold:#e9b72b;--navy:#2f6fb5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1613;--fg:#f1e6d6;--card:#2b211c;--line:#4a3a30}}
:root[data-theme="dark"]{--bg:#1d1613;--fg:#f1e6d6;--card:#2b211c;--line:#4a3a30}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Serif TC","PMingLiU","Songti TC",serif;min-height:100vh;padding:12px}
.wrap{max-width:440px;margin:0 auto}
.cab{background:var(--red);border-radius:8px;padding:10px;box-shadow:0 6px 0 #8f1610}
.roof{background:linear-gradient(#f4cf5a,#d6a21c);margin:-10px -10px 10px;padding:10px 10px 4px;border-radius:8px 8px 0 0;clip-path:polygon(4% 0,96% 0,100% 100%,0 100%)}
.title{background:#f7e27a;border:2px solid #7a4a10;display:flex;align-items:center;justify-content:center;gap:.4em;padding:6px;font-weight:900;font-size:clamp(20px,6vw,28px);letter-spacing:.2em}
.title{overflow:hidden;white-space:nowrap}
.title input{font:inherit;letter-spacing:.1em;width:6.5em;flex:none;background:transparent;border:0;border-bottom:2px dashed #7a4a10;text-align:center;color:#2a1a14;border-radius:0}
.title input::placeholder{color:#8a6a30;font-weight:600;font-size:.6em;letter-spacing:0}
.win{position:relative;height:clamp(250px,70vw,310px);border:4px solid #8f1610;border-radius:4px;overflow:hidden;background:#8c7b6b center/cover no-repeat}
.win::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.18),transparent 35%);pointer-events:none}
.hall{position:absolute;left:50%;top:16%;width:54%;transform:translateX(-50%)}
.hall .r{height:26px;background:linear-gradient(#f6d35e,#c99412);clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);border-radius:4px}
.hall .b{height:64px;margin:0 8%;background:rgba(80,10,8,.55);border:4px solid var(--red);border-top:8px solid var(--red);display:flex;align-items:center;justify-content:center;font-size:12px;color:#f7e27a;letter-spacing:.3em}
.gravel{position:absolute;left:0;right:0;bottom:0;height:34%;background:repeating-radial-gradient(circle at 20% 30%,#b9bcc2 0 2px,#8f939b 2px 4px);opacity:.9}
.path{position:absolute;left:50%;transform:translateX(-50%);top:48%;bottom:0;width:46%;background:repeating-linear-gradient(#cdbb9c 0 16px,#a8957a 16px 18px);clip-path:polygon(34% 0,66% 0,100% 100%,0 100%)}
.fence{position:absolute;top:50%;bottom:30%;width:30%;border-top:6px solid var(--red);border-bottom:6px solid var(--red)}
.fence.l{left:4%;clip-path:polygon(0 0,100% 20%,100% 100%,0 80%)}
.fence.r{right:4%;clip-path:polygon(0 20%,100% 0,100% 80%,0 100%)}
.tube{width:28px;height:46px;background:#6b2b17;border:3px solid var(--gold);border-radius:5px 5px 9px 9px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:11px;writing-mode:vertical-rl;letter-spacing:0}
.tray{position:absolute;left:20%;bottom:3%;width:92px;height:62px;background:var(--red);border:3px solid #8f1610;border-radius:4px 4px 8px 8px;display:flex;align-items:flex-end;justify-content:center;color:#f7e27a;font-size:11px}
.tray span{position:absolute;top:-18px;background:#8f1610;padding:1px 6px;border-radius:3px}
.slip{position:absolute;bottom:4px;width:22px;height:70px;border:0;padding:0;background:#f4d98a;color:#5a1a10;border:1px solid #a97a15;border-radius:2px;font:700 11px/1.1 inherit;writing-mode:vertical-rl;cursor:pointer;display:none;animation:drop .6s ease-out,glow 1.4s 0.6s infinite alternate}
.slip.on{display:block}
@keyframes drop{from{transform:translateY(-120px) rotate(30deg);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{to{box-shadow:0 0 14px 4px #ffe27a}}
.fig{position:absolute;bottom:13%;left:54%;transform-origin:50% 100%;width:34px;margin-left:-17px}
.fig svg{display:block;width:34px;height:60px;overflow:visible}
.fig.walk svg,.fig.walk img{animation:bob .35s infinite alternate}
.fig img{display:none;position:absolute;left:-6px;bottom:0;width:46px;max-height:72px;object-fit:contain}
.fig.cust svg{display:none}.fig.cust img{display:block}
#bg{position:absolute;left:0;right:0;top:0;height:42%;background:#a9d3ee center/cover no-repeat}
.hs{display:none;position:absolute;right:-8px;top:14px;width:7px;height:26px;background:#f4d98a;border:1px solid #a97a15}
.fig.cust.has .hs{display:block}
@keyframes bob{to{transform:translateY(-4px) rotate(2deg)}}
.held{display:none}.fig.has .held{display:block}
.coin{position:absolute;left:50%;margin-left:-9px;top:-24px;width:18px;height:18px;border-radius:50%;background:radial-gradient(#ffe27a,#c99412);border:2px solid #8a6410;opacity:0;z-index:3;pointer-events:none}
.coin.go{animation:cd .7s ease-in forwards}
@keyframes cd{0%{opacity:1;transform:translateY(0)}70%{opacity:1;transform:translateY(26px)}100%{opacity:0;transform:translateY(31px) scale(.5)}}
.low{display:flex;gap:10px;margin-top:10px;align-items:stretch}
.note{flex:1;background:#f7e9a0;color:#3a2a10;border:3px solid #d1a623;border-radius:4px;padding:6px 8px;font-size:12px;line-height:1.5}
.note b{display:block;text-align:center;font-size:14px}
.acc{width:42%;background:#1b1b1b;border:4px solid #8f1610;border-radius:6px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.slot{width:70%;height:10px;background:#000;border:2px solid #777;border-radius:6px}
.acc button{font:700 15px inherit;font-family:inherit;color:#2a1a14;background:var(--gold);border:0;border-radius:20px;padding:8px 14px;cursor:pointer;min-height:44px;width:100%}
.acc button:disabled{opacity:.5;cursor:wait}
.msg{text-align:center;font-size:14px;min-height:1.4em;margin:10px 0 0;color:#fff}
details{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
summary{cursor:pointer;font-weight:700}
label{display:block;margin:10px 0 4px;font-size:14px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row input[type=text],textarea{flex:1;min-width:0;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
textarea{width:100%;min-height:90px;font-size:13px}
.btn{font:inherit;padding:8px 12px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;cursor:pointer;min-height:40px}
.small{font-size:12px;opacity:.8;line-height:1.6}
dialog{max-width:min(420px,94vw);width:100%;border:0;border-radius:10px;padding:0;background:#fbf1d6;color:#2a1a14}
dialog::backdrop{background:rgba(0,0,0,.6)}
.card{padding:16px 18px 18px}
.card h2{margin:0 0 4px;font-size:20px;text-align:center}
.card .sub{text-align:center;font-size:13px;color:#7a4a10;margin-bottom:10px}
.poem{text-align:center;font-size:19px;line-height:1.9;letter-spacing:.15em;border-block:2px solid #c9a24a;padding:8px 0;margin:6px 0 10px}
.mean{font-size:14px;line-height:1.7;margin-bottom:8px}
.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{width:4.5em;text-align:left;color:#8f1610;vertical-align:top;padding:4px 0}
.tb td{padding:4px 0;border-top:1px dashed #d8c08a}
.gt{color:#8f1610;font-weight:700;margin:6px 0 2px;border-top:2px solid #c9a24a;padding-top:8px}
.kv{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:3px 8px;font-size:13px;line-height:1.5}
.kv .k{color:#8f1610;font-weight:700;white-space:nowrap}
.kv .v{border-bottom:1px dashed #d8c08a;padding-bottom:2px;min-width:0;overflow-wrap:anywhere}
.story{background:transparent;border:0;border-top:1px dashed #d8c08a;border-radius:0;padding:8px 0 0;margin-top:10px}
.story p{font-size:13px;line-height:1.7;margin:6px 0}
.na{color:#8f1610;font-weight:700;text-align:center;padding:10px 0}
.close{width:100%;margin-top:12px;background:var(--red);color:#fff;border:0;border-radius:6px;padding:10px;font:inherit;font-weight:700;cursor:pointer}
@media (prefers-reduced-motion:reduce){.fig.walk svg,.slip{animation:none}}
:focus-visible{outline:3px solid #2f6fb5;outline-offset:2px}
.fig canvas{display:none;position:absolute;left:50%;margin-left:-34px;bottom:0;width:68px;height:104px;pointer-events:none}
.fig.vrm canvas{display:block}
.fig.vrm svg,.fig.vrm img,.fig.vrm .hs{display:none}
.pick{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px 12px;min-width:0}
.pick legend{font-weight:700;padding:0 6px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{margin:0;flex:1;min-width:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:9px 6px;min-height:44px;border:2px solid var(--line);border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;background:var(--bg)}
.seg input:checked+span{border-color:var(--red);background:var(--red);color:#fff}
.seg input:focus-visible+span{outline:3px solid var(--navy);outline-offset:2px}
.pane{margin-top:8px}
.pane[hidden]{display:none}
.pane select{width:100%;font:inherit;font-size:13px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);min-height:40px}
</style>

 <summary>設定：背景圖與籤詩資料／選擇人偶</summary>

<p class="small">資料說明：六十甲子籤各廟詩文略有差異。60 首的詩文、屬性與方位、29 項籤解及故事，皆整理自籤詩網（chance.org.tw）「六十甲子籤」各籤頁面，並保留網頁所註的異文說明。第 32 籤原網頁誤植「前門前」，已依通行本改為「在門前」。籤解為民間傳統說法，各廟或有不同，僅供參考。</p>

<script>
const $=id=>document.getElementById(id);
const NA='【資料不足，無法確認】';
const S='甲乙丙丁戊己庚辛壬癸',Y1='子寅辰午申戌',Y2='丑卯巳未酉亥';
const nm=n=>{const s=Math.floor((n-1)/6),k=(n-1)%6;return S[s]+(s%2?Y2:Y1)[k]};
const L=['旅行','健康','感情','財運','求子','運勢'];
const SRCN='籤詩網（chance.org.tw）';

如意。","月中至。","速至。"],"s":[["桃園三結義","大丈夫(關公)以四海為家。何患乎吾無兄弟。入桃園。睹兩人奇異。請問英雄何處。雄紏紏。朗曰張飛。貌堂堂。溫言劉備。出生投地今逢主。須待挽天河水來蕩滌。誠哉龍虎風雲會。宰牛馬昭告天地。結義匡扶漢室。"],["曹操賜雲祥馬袍贈金銀。",""]]},"15":{"m":"屬土利年　四方皆宜","p":["八十原來是太公","看看晚景遇文王","目下緊事休相問","勸君且守待運通"],"n":["目字，另有改作月字一說。"],"i":["大破財。求解和。","難成。","平平。","平平。","配偶慢成。","不可。","先女後男。(先男後女)","晚即發。","難就。","先平後吉。","求平安。十日險。","慢日可行。","漸且候時。","月尾有。","不如意。有事。","待時。","緊尋得。遲者無。","不日到。","不吉。求貴人和。","漸且退步。","無收。","漸且退步。","遲必發。","無財和者吉","無望","且守慢至。","不遂。","不可急。","遲延。"],"s":[["渭水河太公釣魚","周。姜尚。字子牙。汲人。先世封於呂。亦曰呂望。避紂亂居東海之濱。釣於磻溪(渭水)。文王聞其賢。聘為師(丞相)。(其時年八十)後周伐紂。滅商興周。武王稱曰尚父。封其子丁公於齊。"],["武吉挑柴打死人。(武吉遇師)","武吉本是樵夫。姜子牙釣于磻溪。二人相遇。見子牙用直鉤釣魚大笑。子牙看武吉氣息斷曰。今日入城打死人。武吉怒別。擔柴入城。誤觸王相致死。文王畫地為牢。武吉後被暫釋。照顧老母至秋後正法。老母令其找姜子牙求救。太公收其為徒。授兵法。又令其挖坑施咒破解先天數。秋後不見武吉伏刑。文王演先天數。以為武吉已畏罪自殺。後文王碰見武吉。武吉引文王見姜太公。受封武德將軍。師徒二人為文王效力。(故事見于封神榜)故　事籤解一"]]},"16":{"m":"屬水利冬　宜其北方","p":["不須作福不須求","用盡心機總未休","陽世不知陰世事","法官如爐不自由"],"n":[],"i":["恐防風波災。","退步。","恐防有變。","陰邪。求神解決。","不合。有鬼作怪。","不可。","先男後女。(子媳虛)","春夏好秋冬呆。","難得。","浮沉。","必危。有陰公作祟。未日(半月)過不畏。","防險。","難就。了錢。","遲慢。","不如意。惹失。","不可。","難尋。(未日(半月)在)","不日到。","緊防刑事。","不可納。","無收。","不可。","地勢不佳。","有陰鬼。難得。","難如意。要忍耐。","失利難如意。","了錢。","遲慢。","必有失音。"],"s":[["李世民遊地府","唐太宗。李世民。因涇河鬼龍投訴世民曾許諾救他而沒救。閻王召世民下幽冥對案。由于鬼門關有入無出。須經過十殿至輪轉。超生貴道門而回陽。時歷三晝夜。王宮已把世民入棺。後破棺救出世民。太宗有感惡報之慘。于是大赦天下。四百死囚離獄。三千怨女出宮。(故事見于西遊記11回)"]]},"17":{"m":"屬火利夏　宜其南方","p":["舊恨重重未改為","家中禍患不臨身","須當謹防宜作福","龍蛇交會得和合"],"n":["「不」或誤，連上句當作「已」。"],"i":["人害緊。和無事。","先難後易。","和為貴。","居之則安。","大吉。","不可。","先男後女。","勤儉必得。","修陰德必中。","淡淡。","求神庇祐。辰未日(半月)過漸癒。","辰巳日則可。","平平。","辰未日(半月)到。","平平。財輕。","隨意。(不可)","辰巳日在。(難尋)","初初到尾。(不明其意)","和為貴。不和凶。","納者不可。","平平。少利。","有犯陰邪。","平平。小吉。","微利運不辰","運不合。求小利。","微利。","不畏。漸漸平安。","待時。","慢。"],"s":[["莊子破棺。(莊子試妻)","周朝。姓莊名周。字子休。宋國蒙邑人。仕周為漆園吏。莊子假死試妻。其妻田氏守孝。七天後有一楚國王孫公子到訪。自稱莊子之徒。願執百日之喪。田氏愛公子俊美。不足廿日成婚。公子叫心疼。曰腦髓(人心)可治。田氏往劈莊子棺以取腦髓(人心)。莊子破棺而出。後田氏羞愧自殺。"],["薛公大鬧花燈跌死太子驚死聖駕",""],["姜尚未卜吉凶事",""]]},"18":{"m":"屬土利年。四方皆宜","p":["君問中間此言因","看看祿馬拱前程","若得貴人多得利","和合自有兩分明"],"n":[],"i":["忍耐求和。","貴人利。和氣成。","圓滿進財。","瑞氣盈庭。","大吉。","月光好。月暗平。","先男。","不多。(萬金萬貫連得)","有望。", FH.presets=VRM_PRESETS;FH.defaultId='chatvrm-b';
const cv=document.getElementById('vrmcv'),fgEl=document.getElementById('fig'),W=68,H=104;
let renderer,scene,camera,slip,cur=null,isV0=false,baseYaw=0,hips0=0;
function init(){
 if(renderer)return;
 renderer=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(W,H,false);renderer.setClearColor(0x000000,0);

 const dl=new THREE.DirectionalLight(0xffffff,2.2);dl.position.set(.6,1.5,2.5);scene.add(dl);scene.add(new THREE.AmbientLight(0xffffff,1.1));
 slip=new THREE.Mesh(new THREE.BoxGeometry(.035,.17,.01),new THREE.MeshBasicMaterial({color:0xf4d98a}));slip.visible=false;scene.add(slip);
}
function setup(v){
 if(cur){scene.remove(cur.scene);VRMUtils.deepDispose(cur.scene)}
 VRMUtils.rotateVRM0(v);scene.add(v.scene);v.scene.traverse(o=>{o.frustumCulled=false});
 cur=v;isV0=v.meta?.metaVersion==='0';baseYaw=v.scene.rotation.y;yaw=yawT=0;phase=0;amp=0;holdK=0;
 v.scene.updateMatrixWorld(true);
 const bb=new THREE.Box3().setFromObject(v.scene),h=bb.max.y-bb.min.y,cy=(bb.max.y+bb.min.y)/2;
 const d=h*1.06/(2*Math.tan(THREE.MathUtils.degToRad(11)));
 camera.position.set(0,cy,d);camera.lookAt(0,cy,0);
 if(v.lookAt)v.lookAt.target=camera;
 const hp=v.humanoid.getNormalizedBoneNode('hips');hips0=hp?hp.position.y:0;
}
FH.load=async(id,url,label)=>{
 init();
 const p=id&&VRM_PRESETS.find(x=>x.id===id),urls=p?p.urls:[url],st=document.getElementById('vrmst');
 let last;
 for(const u of urls){
  try{
   const gltf=await new Promise((res,rej)=>{const l=new GLTFLoader();l.register(pp=>new VRMLoaderPlugin(pp));
    l.load(u,res,e=>{st.textContent=e.total?'載入 VRM… '+Math.round(e.loaded/e.total*100)+'%':'載入 VRM… '+(e.loaded/1048576).toFixed(1)+' MB'},rej)});
   const v=gltf.userData.vrm;if(!v)throw new Error('不是有效的 VRM 檔案');
   setup(v);FH.curId=id||'file';FH.ready=true;st.textContent='已載入：'+(p?p.name:label);
   if(window.FH.refresh)window.FH.refresh();return;
  }catch(e){last=e;console.warn('VRM source failed, trying next:',u,e)}
 }
 throw last||new Error('載入失敗');
};
let yaw=0,yawT=0,walking=false,phase=0,amp=0,holding=false,holdK=0,t=0,happyT=0,happyV=0,blinkT=2,blinkP=-1,last=performance.now();
const tmp=new THREE.Vector3(),PI=Math.PI;
FH.move=(dx,dy)=>{if(Math.hypot(dx,dy)>1)yawT=Math.atan2(dx,-dy);walking=true};
FH.stop=()=>{walking=false};
FH.hold=b=>{holding=b};
FH.happy=()=>{happyT=2.5;yawT=0};
function tick(now){
 requestAnimationFrame(tick);
 const dt=Math.min(.05,(now-last)/1000);last=now;
 if(!cur||!renderer||document.hidden||!fgEl.classList.contains('vrm'))return;
 t+=dt;if(walking)phase+=dt*9;
 amp+=((walking?1:0)-amp)*Math.min(1,dt*10);holdK+=((holding?1:0)-holdK)*Math.min(1,dt*8);
 const hm=cur.humanoid,N=n=>hm.getNormalizedBoneNode(n);
 const set=(n,x,y,z)=>{const b=N(n);if(b)b.rotation.set(isV0?-x:x,y,isV0?-z:z)};
 const s=Math.sin(phase)*amp,L=(a,b)=>a+(b-a)*holdK;
 set('leftUpperLeg',-s*.6,0,0);set('rightUpperLeg',s*.6,0,0);
 set('leftLowerLeg',Math.max(0,Math.cos(phase))*.7*amp,0,0);set('rightLowerLeg',Math.max(0,-Math.cos(phase))*.7*amp,0,0);
 set('leftUpperArm',.1+s*.45,0,-1.3);set('leftLowerArm',0,0,-.15);
 set('rightUpperArm',L(.1-s*.45,-.9),0,L(1.3,1.15));set('rightLowerArm',L(0,-.7),0,L(.15,.1));
 set('spine',.04*amp,Math.sin(phase)*.08*amp,0);set('chest',Math.sin(t*1.6)*.015,0,0);
 const hp=N('hips');if(hp)hp.position.y=hips0+Math.abs(Math.sin(phase))*.02*amp;
 const diff=((yawT-yaw+PI)%(2*PI)+2*PI)%(2*PI)-PI;yaw+=diff*Math.min(1,dt*8);cur.scene.rotation.y=baseYaw+yaw;
 const em=cur.expressionManager;
 if(em){blinkT-=dt;if(blinkT<0&&blinkP<0){blinkP=0;blinkT=2+Math.random()*3}
  let bl=0;if(blinkP>=0){blinkP+=dt;bl=Math.sin(Math.min(1,blinkP/.16)*PI);if(blinkP>.16)blinkP=-1}
  happyT=Math.max(0,happyT-dt);happyV+=((happyT>0?1:0)-happyV)*Math.min(1,dt*6);
  em.setValue('blink',bl);em.setValue('happy',happyV)}

 if(holdK>.5){const hn=N('rightHand');if(hn){hn.getWorldPosition(tmp);slip.position.copy(tmp).add(new THREE.Vector3(Math.sin(cur.scene.rotation.y-baseYaw)*.05,.07,Math.cos(cur.scene.rotation.y-baseYaw)*.05));slip.rotation.y=cur.scene.rotation.y;slip.visible=true}}else slip.visible=false;
 renderer.render(scene,camera);
}
requestAnimationFrame(tick);
dispatchEvent(new Event('fh-ready'));
